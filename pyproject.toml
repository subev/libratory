[project]
name = "libratory-runtime"
version = "0"
requires-python = "==3.12.*"
dependencies = [
  # Apple Silicon only — MLX is Metal, and there is no wheel for anything else.
  "mlx==0.32.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-lm==0.31.3 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-audio==0.4.5 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "nanocodec-mlx ; sys_platform == 'darwin' and platform_machine == 'arm64'",

  "marker-pdf==1.10.2",
  "surya-ocr==0.17.1",
  "kokoro==0.9.4",
  "misaki==0.9.4",
  "soundfile==0.13.1",
  "numpy==1.26.4",
  "torch==2.12.1",
  "transformers==4.57.6",
  "regex==2024.11.6",
  "FlagEmbedding==1.4.0",
  "huggingface_hub==0.36.2",
  # scipy 1.18 requires numpy>=2 at runtime while declaring a looser bound, so a resolver picks it
  # happily and then transformers' model registry comes up half empty. 1.17 is the last numpy-1 one.
  "scipy==1.17.0",
  # misaki's English G2P calls spacy.cli.download() at synthesis time when this is absent — a
  # network fetch in the middle of a job, on a machine that may be offline. Declared instead.
  "en-core-web-sm",
  "platformdirs",

  # misaki[zh] G2P chain for Kokoro's Mandarin voices — pure Python.
  "cn2an==0.5.24", "jieba==0.42.1", "ordered-set==4.1.0", "proces==0.1.7", "pypinyin==0.55.0",
]

[tool.uv.sources]
nanocodec-mlx = { git = "https://github.com/nineninesix-ai/nanocodec-mlx.git" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
# PyPI's Linux torch is the CUDA build — a 532 MB wheel towing ~3 GB of nvidia-* packages that a
# CPU-only server never loads. The cpu index serves the same torch without the freight; a Linux box
# with an NVIDIA card points this at /whl/cu130 instead and re-locks. macOS keeps PyPI either way.
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.uv]
# The pins above deliberately contradict what mlx-audio declares: transformers 5.x breaks
# marker-pdf, and huggingface_hub 1.x is untested here. setup.sh used to express that by installing
# three packages with --no-deps, which resolved nothing and recorded nothing. Stating it as an
# override keeps the rest of the graph resolved and puts the reason in the lockfile.
override-dependencies = [
  "transformers==4.57.6",
  "huggingface_hub==0.36.2",
  "numpy==1.26.4",
  # nanocodec-mlx pins mlx 0.29.2; mlx-audio 0.4.5 needs 0.32. --no-deps hid this entirely.
  "mlx==0.32.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
# explicit: only packages routed here by [tool.uv.sources] may use it — everything else stays PyPI.
explicit = true
