name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: pnpm audit

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: false
      - run: node --test scripts/check-python-audit.test.mjs
      - name: Audit the complete ML lockfile without installing models
        run: |
          status=0
          uv audit --locked --output-format json > "$RUNNER_TEMP/python-audit.json" || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          node scripts/check-python-audit.mjs "$RUNNER_TEMP/python-audit.json"
      - name: Audit Pocket TTS including its locked transitive dependencies
        # --disable-pip avoids downloading gigabytes of torch merely to inspect package versions.
        run: uv tool run pip-audit==2.10.1 --no-deps --disable-pip -r scripts/requirements-pocket.txt

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: low
          license-check: false
