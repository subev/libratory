# Builds and publishes the macOS app on a version tag: v26.826.0 is the first release on 26 August
# 2026, v26.826.1 the second that day. Without an Apple certificate the DMG is still built and
# published — people can download and run it, they just have to get past Gatekeeper by hand, and
# the in-app updater cannot install anything until the certificate exists.
name: Release

# Two ways in, one path out. Locally: `pnpm release` works out the version, commits, tags and
# pushes — the tag starts this. From the GitHub UI: Actions → Release → Run workflow does the same
# thing here, so a release needs no checkout at all. Either way the version is computed by
# scripts/release.mjs and never typed by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# electron-builder --publish creates the release and uploads to it
permissions:
  contents: write

jobs:
  macos:
    # arm64. MLX is Metal, so an Intel runner cannot even smoke-test what it builds.
    runs-on: macos-15
    # The Apple secrets live in this environment rather than on the repository, so they are exposed
    # only to this job and can be put behind a required reviewer. A signing key is not revocable by
    # us — Developer ID revocation goes through Apple Product Security and breaks installation of
    # every build ever signed with it — so limiting who can reach it matters more than usual.
    environment: release
    # `secrets` is not a context a step-level `if` can read; a job-level env is.
    env:
      HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # release.mjs reads existing tags to pick the next number, and pushes when run from here
          fetch-depth: 0
          # A tag build must ship the tagged commit. Manual releases still cut from main.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          persist-credentials: ${{ github.event_name == 'workflow_dispatch' }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Work out the version and tag it
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.mjs --yes

      - name: Verify the release tag matches the package
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const p = require("./packages/desktop/package.json"); if (process.env.RELEASE_TAG !== "v" + p.version) throw new Error("Release tag does not match package version")'

      - run: pnpm install --frozen-lockfile

      # Not the server suite: it needs a live Postgres on 5433, and GitHub's macOS runners have no
      # Docker and cannot run service containers. Those tests run locally and would need a Linux
      # job of their own — releasing on a green macOS build is not a claim that they passed.
      - run: pnpm --filter @libratory/web --filter @libratory/desktop test

      # Only for rendering the .icns. ffmpeg and poppler are NOT installed here: they ship inside
      # the DMG, so they are downloaded as a pinned, checksummed bundle rather than taken from
      # whatever Homebrew is current on the runner that day.
      - run: brew install librsvg imagemagick

      # Compiles the server, builds the web bundle, bundles the CLI tools, renders the icon — and
      # stops before packaging so the step below can do it once, with signing if we have it.
      # Building the pieces separately here is how CI ends up shipping an Electron shell with no
      # server in it and nobody noticing until someone downloads it.
      - run: scripts/desktop-build.sh --no-package

      # electron-builder publishes once per target, and dmg and zip both check "does the release
      # exist" before creating one — so they race, both create a draft, and the artefacts land
      # split across two releases with the same tag. Creating it first means both find it.
      - name: Open the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./packages/desktop/package.json').version")"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "$TAG" --notes "Build in progress…" --latest=false

      - name: Package and publish
        env:
          # Without this electron-builder picks up any identity in the keychain; on a runner there
          # is none, but being explicit is what makes an unsigned build deliberate rather than luck.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.HAS_CERT == 'yes' && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Notarisation, either way. The API key is preferred: it is scoped and revocable, where an
          # app-specific password is tied to the Apple ID itself.
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A secret that does not exist arrives as an empty string, not as an absent variable, and
          # electron-builder treats an empty CSC_LINK as a certificate path — resolving it to the
          # project directory and failing with "not a file". Unset rather than blank.
          if [ "$HAS_CERT" = "no" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID \
                  APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
            # Ad-hoc rather than unsigned: an unsigned bundle is reported to the user as *damaged*,
            # with no way past it. See packages/desktop/README.md.
            IDENTITY="-c.mac.identity=-"
          fi
          pnpm --filter @libratory/desktop exec electron-builder --mac --publish always ${IDENTITY:-}

      - name: Say what shipped
        run: |
          ls -lh packages/desktop/release/*.dmg packages/desktop/release/*.zip
          if [ "$HAS_CERT" = "no" ]; then
            echo "::warning::Unsigned build. The download works but Gatekeeper blocks it until the user allows it by hand, and the in-app updater cannot install it. See packages/desktop/README.md."
          fi
